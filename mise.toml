[tools]
perl = "5.40.2.1"
node = "22"

[env]
PORT = "4128"

[tasks.test]
description = "Run the Selecto Components Perl test suite"
run = 'script/with-local-sibling "$(mise which perl)" "$(dirname "$(mise which perl)")/prove" --exec "$(mise which perl)" -lr t'

[tasks.assets]
description = "Build and sync shared web assets and the API Console from local siblings or npm"
run = "node script/selecto-web-assets.mjs sync --profile perl-components --target public/selecto-components && script/sync-api-console && npm run build"

[tasks."assets:check"]
description = "Verify committed generated browser assets match their shared sources"
run = "node script/selecto-web-assets.mjs sync --profile perl-components --target public/selecto-components --check && script/sync-api-console --check && npm run build:check"

[tasks."test:browser"]
description = "Run browser interaction tests for the Components asset"
run = "npm run test:browser"

[tasks.server]
description = "Run the Northwind Components example"
run = "script/with-local-sibling mise exec -- perl -Ilib examples/northwind.pl"

[tasks.verify]
description = "Run syntax, unit, WebSocket, and distribution checks"
run = '''
set -eu
mise run assets:check
mise run test:browser
selecto_test_perl=$(mise which perl)
if script/with-local-sibling "$selecto_test_perl" -MSelecto::Perl::Northwind::Database -e 1 >/dev/null 2>&1; then
  script/with-local-sibling "$selecto_test_perl" -Ilib -c examples/northwind.pl
else
  echo "Skipping optional Northwind example compile (fixture not checked out)"
fi
script/with-local-sibling "$selecto_test_perl" "$(dirname "$selecto_test_perl")/prove" --exec "$selecto_test_perl" -lr t
script/with-local-sibling "$selecto_test_perl" Makefile.PL
script/with-local-sibling make test
'''

[tasks."stack:setup"]
description = "Create synthetic stack tables once in an explicitly owned database"
run = 'script/with-local-sibling mise exec -- perl -Ilib examples/canonical-stack.pl setup'

[tasks."stack:server"]
description = "Serve native HTMX, canonical API and the built Vue app on localhost"
run = 'script/with-local-sibling mise exec -- perl -Ilib examples/canonical-stack.pl daemon -l "http://127.0.0.1:${SELECTO_PERL_STACK_HTTP_PORT:-4187}"'

[tasks."test:canonical-stack"]
description = "Run real PostgreSQL HTTP/session checks for the shared explorer service"
run = '''
: "${SELECTO_PERL_STACK_POSTGRES_URL:?Set the owned stack fixture URL}"
export SELECTO_REMOTE_REQUIRE_POSTGRES=1
script/with-local-sibling "$(mise which perl)" "$(dirname "$(mise which perl)")/prove" --exec "$(mise which perl)" -lv t/canonical_stack_postgresql.t
'''

[tasks."test:api-console"]
description = "Run the packaged Console through real Perl/PostgreSQL HTTP and browser sessions"
run = '''
: "${SELECTO_PERL_STACK_POSTGRES_URL:?Set the owned stack fixture URL}"
npm exec -- playwright test --config playwright.api-console.config.js
'''

[tools]
perl = "5.40.2"
node = "22"

[env]
PORT = "4128"

[tasks.test]
description = "Run the Selecto Components Perl test suite"
run = "script/with-local-sibling prove -lr t"

[tasks.assets]
description = "Build and sync shared web assets and the API Console from local siblings or npm"
run = "node script/selecto-web-assets.mjs sync --profile perl-components --target public/selecto-components && script/sync-api-console && npm run build"

[tasks."assets:check"]
description = "Verify committed generated browser assets match their shared sources"
run = "node script/selecto-web-assets.mjs sync --profile perl-components --target public/selecto-components --check && npm run build:check"

[tasks."test:browser"]
description = "Run browser interaction tests for the Components asset"
run = "npm run test:browser"

[tasks.server]
description = "Run the Northwind Components example"
run = "script/with-local-sibling perl -Ilib examples/northwind.pl"

[tasks.verify]
description = "Run syntax, unit, WebSocket, and distribution checks"
run = "mise run assets:check && mise run test:browser && script/with-local-sibling sh -c 'if perl -MSelecto::Perl::Northwind::Database -e 1 >/dev/null 2>&1; then perl -Ilib -c examples/northwind.pl; else echo \"Skipping optional Northwind example compile (fixture not checked out)\"; fi; prove -lr t && perl Makefile.PL && make test'"
